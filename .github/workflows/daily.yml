name: TikTok Daily Tracker

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Keep alive
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git commit --allow-empty -m "keep alive $(date)"
          git push

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests pycryptodome

      - name: Run tracker
        env:
          TABCUT_EMAIL:    ${{ secrets.TABCUT_EMAIL }}
          TABCUT_PASSWORD: ${{ secrets.TABCUT_PASSWORD }}
        run: python main.py

      - name: Commit data
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/latest.json
          git diff --staged --quiet || git commit -m "update data $(date)"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
