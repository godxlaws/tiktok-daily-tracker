name: TikTok Daily Tracker

on:
  schedule:
    - cron: '0 2 * * *'   # 09:00 น. ไทย
  workflow_dispatch:        # กดมือได้

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      # Keep repo active — ป้องกัน GitHub disable cron
      - name: Keep alive
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git commit --allow-empty -m "keep alive $(date)"
          git push

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests pycryptodome

      - name: Run tracker
        env:
          BOT_TOKEN:       ${{ secrets.BOT_TOKEN }}
          CHAT_ID:         ${{ secrets.CHAT_ID }}
          TABCUT_EMAIL:    ${{ secrets.TABCUT_EMAIL }}
          TABCUT_PASSWORD: ${{ secrets.TABCUT_PASSWORD }}
        run: python main.py
