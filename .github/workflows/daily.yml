name: TikTok Daily Tracker

on:
  schedule:
    - cron: '35 4 * * *'  # 11:35 น. ไทย (04:35 UTC)
  workflow_dispatch:      # ปุ่มกดรันเอง
  push:                   # เพิ่มอันนี้: ให้รันทันทีที่กด Commit เพื่อเช็คว่าโค้ดผ่านไหม
    branches:
      - main

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pycryptodome
      - name: Run tracker
        env:
          BOT_TOKEN:       ${{ secrets.BOT_TOKEN }}
          CHAT_ID:         ${{ secrets.CHAT_ID }}
          TABCUT_EMAIL:    ${{ secrets.TABCUT_EMAIL }}
          TABCUT_PASSWORD: ${{ secrets.TABCUT_PASSWORD }}
        run: python main.py
