name: TikTok Daily Tracker

on:
  schedule:
    - cron: '0 2 * * *'  # 09:00 น. ไทย
  workflow_dispatch:       # กดรันมือได้

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run tracker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.CHAT_ID }}
        run: python main.py
