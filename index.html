<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Shop Tracker 🔥</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f0f;
    color: #fff;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #ff0050, #ff4d00);
    padding: 20px;
    text-align: center;
  }
  header h1 { font-size: 1.6rem; font-weight: 800; }
  header p  { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }

  .updated {
    text-align: center;
    padding: 10px;
    font-size: 0.8rem;
    color: #888;
    background: #1a1a1a;
  }

  .tabs {
    display: flex;
    overflow-x: auto;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: none;
    padding: 12px 20px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    color: #888;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }
  .tab.active {
    color: #ff0050;
    border-bottom-color: #ff0050;
  }

  .section { display: none; padding: 16px; }
  .section.active { display: block; }

  .section-title {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 14px;
    padding: 8px 12px;
    background: #1a1a1a;
    border-radius: 8px;
    border-left: 4px solid #ff0050;
  }

  .cards { display: flex; flex-direction: column; gap: 14px; }

  .card {
    background: #1a1a1a;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    gap: 12px;
    padding: 12px;
    border: 1px solid #2a2a2a;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: #ff0050; }

  .card-img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
    background: #2a2a2a;
  }
  .card-img-placeholder {
    width: 90px;
    height: 90px;
    border-radius: 8px;
    background: #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    flex-shrink: 0;
  }

  .card-body { flex: 1; min-width: 0; }

  .card-title {
    font-size: 0.88rem;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .badge-red    { background: #ff005020; color: #ff6b6b; border: 1px solid #ff005040; }
  .badge-green  { background: #00ff8820; color: #00ff88; border: 1px solid #00ff8840; }
  .badge-orange { background: #ff880020; color: #ffaa44; border: 1px solid #ff880040; }
  .badge-blue   { background: #0088ff20; color: #44aaff; border: 1px solid #0088ff40; }
  .badge-gray   { background: #44444420; color: #999; border: 1px solid #44444440; }
  .badge-warn   { background: #ff440020; color: #ff8844; border: 1px solid #ff440040; }

  .stats {
    display: flex;
    gap: 12px;
    font-size: 0.75rem;
    color: #aaa;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .stats span { display: flex; align-items: center; gap: 3px; }

  .btn-shop {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #ff0050;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .btn-shop:hover { opacity: 0.85; }

  .rank-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: #ff0050;
    color: #fff;
    font-size: 0.7rem;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 10px;
  }
  .card-img-wrap { position: relative; flex-shrink: 0; }

  .seller-name {
    font-size: 0.72rem;
    color: #888;
    margin-bottom: 6px;
  }

  .comm-warn {
    font-size: 0.75rem;
    color: #ff6644;
    margin-bottom: 6px;
  }
  .comm-ok {
    font-size: 0.75rem;
    color: #44cc88;
    margin-bottom: 6px;
  }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: #555;
    font-size: 0.9rem;
  }

  .loading {
    text-align: center;
    padding: 60px 20px;
    color: #888;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #333;
    border-top-color: #ff0050;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>🔥 TikTok Shop Tracker</h1>
  <p>สินค้าขายดีและกำลังมาแรงใน TikTok Shop Thailand</p>
</header>

<div class="updated" id="updated">กำลังโหลด...</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('viral')">🚀 VIRAL</div>
  <div class="tab" onclick="switchTab('stable')">📈 STABLE</div>
  <div class="tab" onclick="switchTab('peak')">⚠️ PEAK</div>
  <div class="tab" onclick="switchTab('top5')">🏆 TOP 5</div>
</div>

<div id="viral"  class="section active"></div>
<div id="stable" class="section"></div>
<div id="peak"   class="section"></div>
<div id="top5"   class="section"></div>

<script>
function switchTab(id) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['viral','stable','peak','top5'][i] === id)
  })
  document.querySelectorAll('.section').forEach(s => {
    s.classList.toggle('active', s.id === id)
  })
}

function growthBadge(g) {
  if (g === null || g === undefined) return '<span class="badge badge-gray">📊 ใหม่</span>'
  if (g >  0) return `<span class="badge badge-green">📈 +${g}%</span>`
  if (g <  0) return `<span class="badge badge-red">📉 ${g}%</span>`
  return '<span class="badge badge-gray">➡️ ทรงตัว</span>'
}

function commBadge(comm) {
  if (comm === 0) return `<div class="comm-warn">⛔ Commission 0% — เช็ค TikTok Shop ก่อนทำ</div>`
  if (comm > 0)  return `<div class="comm-ok">💸 Commission: ${comm}%</div>`
  return ''
}

function imgEl(url, rank) {
  const badge = rank ? `<div class="rank-badge">#${rank}</div>` : ''
  if (url) return `<div class="card-img-wrap">${badge}<img class="card-img" src="${url}" onerror="this.parentNode.innerHTML='<div class=card-img-placeholder>🛍</div>'"></div>`
  return `<div class="card-img-wrap">${badge}<div class="card-img-placeholder">🛍</div></div>`
}

function renderTrend(items, label, desc, containerId) {
  const el = document.getElementById(containerId)
  if (!items || items.length === 0) {
    el.innerHTML = `<div class="section-title">${label}</div><div class="empty">ไม่มีสินค้าในกลุ่มนี้วันนี้</div>`
    return
  }
  let html = `<div class="section-title">${label} <small style="font-size:0.75rem;font-weight:400;color:#888">${desc}</small></div><div class="cards">`
  items.forEach(item => {
    html += `
      <div class="card">
        ${imgEl(item.img)}
        <div class="card-body">
          <div class="card-title">${item.title}</div>
          <div class="badges">
            <span class="badge badge-orange">📦 1วัน: ${item.sold1d.toLocaleString()}</span>
            <span class="badge badge-blue">3วัน: ${item.sold3d.toLocaleString()}</span>
            <span class="badge badge-gray">📈 x${item.growth}</span>
          </div>
          ${item.link ? `<a class="btn-shop" href="${item.link}" target="_blank">🛒 ดูสินค้า</a>` : ''}
        </div>
      </div>`
  })
  html += '</div>'
  el.innerHTML = html
}

function renderTop5(items, containerId) {
  const el = document.getElementById(containerId)
  if (!items || items.length === 0) {
    el.innerHTML = `<div class="section-title">🏆 TOP 5 ขายดีที่สุด <small style="font-size:0.75rem;font-weight:400;color:#888">เรียงตาม GMV</small></div><div class="empty">ไม่มีข้อมูลวันนี้</div>`
    return
  }
  let html = `<div class="section-title">🏆 TOP 5 ขายดีที่สุด <small style="font-size:0.75rem;font-weight:400;color:#888">เรียงตาม GMV</small></div><div class="cards">`
  items.forEach((item, idx) => {
    const vc = []
    if (item.videos   !== null && item.videos   !== undefined) vc.push(`🎬 ${item.videos} คลิป${item.videos === 0 ? ' ← น้อยมาก!' : ''}`)
    if (item.creators !== null && item.creators !== undefined) vc.push(`👥 ${item.creators} Creator`)

    html += `
      <div class="card">
        ${imgEl(item.img, idx + 1)}
        <div class="card-body">
          <div class="card-title">${item.title}</div>
          ${item.seller ? `<div class="seller-name">🏪 ${item.seller}</div>` : ''}
          <div class="badges">
            <span class="badge badge-orange">📦 ${item.sold.toLocaleString()} ชิ้น</span>
            <span class="badge badge-gray">รวม ${item.total.toLocaleString()}</span>
            ${growthBadge(item.growth)}
          </div>
          ${commBadge(item.comm)}
          ${vc.length ? `<div class="stats">${vc.map(v => `<span>${v}</span>`).join('')}</div>` : ''}
          ${item.link ? `<a class="btn-shop" href="${item.link}" target="_blank">🛒 ดูสินค้า</a>` : ''}
        </div>
      </div>`
  })
  html += '</div>'
  el.innerHTML = html
}

// โหลดข้อมูล
async function loadData() {
  document.getElementById('viral').innerHTML  = '<div class="loading"><div class="spinner"></div>กำลังโหลด...</div>'
  document.getElementById('stable').innerHTML = '<div class="loading"><div class="spinner"></div>กำลังโหลด...</div>'
  document.getElementById('peak').innerHTML   = '<div class="loading"><div class="spinner"></div>กำลังโหลด...</div>'
  document.getElementById('top5').innerHTML   = '<div class="loading"><div class="spinner"></div>กำลังโหลด...</div>'

  try {
    const res  = await fetch('data/latest.json?t=' + Date.now())
    const data = await res.json()

    document.getElementById('updated').textContent = `อัพเดทล่าสุด: ${data.updated}`

    renderTrend(data.viral,  '🚀 VIRAL',  'เพิ่งระเบิด ทำเลยด่วน!',    'viral')
    renderTrend(data.stable, '📈 STABLE', 'กำลังโต ยังทันทำ',           'stable')
    renderTrend(data.peak,   '⚠️ PEAK',   'ขายดีแต่อิ่มตัวแล้ว',       'peak')
    renderTop5(data.top5,    'top5')

  } catch (e) {
    console.error(e)
    document.getElementById('updated').textContent = 'โหลดข้อมูลไม่ได้ — กรุณา run workflow ก่อน'
    document.getElementById('viral').innerHTML  = '<div class="empty">⚠️ ยังไม่มีข้อมูล<br>กรุณา run workflow ใน GitHub Actions ก่อน</div>'
    document.getElementById('stable').innerHTML = ''
    document.getElementById('peak').innerHTML   = ''
    document.getElementById('top5').innerHTML   = ''
  }
}

loadData()
</script>
</body>
</html>
