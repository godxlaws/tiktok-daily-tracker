<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Tracker</title>
<style>
:root {
  --red:    #FE2C55;
  --cyan:   #25F4EE;
  --bg:     #080808;
  --surf:   #111111;
  --card:   #161616;
  --border: #242424;
  --text:   #FFFFFF;
  --muted:  #666;
  --green:  #3ECF6B;
  --orange: #FF9500;
  --gold:   #FFD700;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(8,8,8,0.94);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}

.logo { display: flex; align-items: center; gap: 10px; }

.logo-icon {
  width: 36px; height: 36px;
  background: var(--red);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  box-shadow: 3px 3px 0 var(--cyan);
  flex-shrink: 0;
}

.logo-name { font-size: 1rem; font-weight: 800; letter-spacing: -0.3px; }
.logo-sub  { font-size: 0.65rem; color: var(--muted); }

.ts {
  font-size: 0.68rem;
  color: var(--muted);
  background: var(--surf);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 20px;
}

/* ── TABS ── */
.tabs {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 65px;
  z-index: 19;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex: 1;
  text-align: center;
  padding: 13px 10px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: color .15s, border-color .15s;
  user-select: none;
}
.tab[data-id="viral"].active  { color: var(--red);    border-color: var(--red); }
.tab[data-id="stable"].active { color: var(--cyan);   border-color: var(--cyan); }
.tab[data-id="peak"].active   { color: var(--orange); border-color: var(--orange); }
.tab[data-id="top5"].active   { color: var(--gold);   border-color: var(--gold); }

/* ── SECTIONS ── */
.section { display: none; }
.section.active { display: block; }

/* ── SECTION INTRO ── */
.intro {
  padding: 24px 16px 16px;
  border-bottom: 1px solid var(--border);
}
.intro-eyebrow {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
}
.intro-title {
  font-size: 2rem;
  font-weight: 900;
  letter-spacing: -1px;
  line-height: 1;
}
.intro-title .r { color: var(--red); }
.intro-title .c { color: var(--cyan); }
.intro-title .o { color: var(--orange); }
.intro-title .g { color: var(--gold); }
.intro-sub {
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.5;
}

/* ── GRID ── */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 14px;
}

@media (min-width: 700px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 1000px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}

/* ── PRODUCT CARD (vertical) ── */
.pcard {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: border-color .15s, transform .1s;
  position: relative;
}
.pcard:active { transform: scale(0.98); }

.pcard.viral  { border-top: 3px solid var(--red); }
.pcard.stable { border-top: 3px solid var(--cyan); }
.pcard.peak   { border-top: 3px solid var(--orange); }

/* image area */
.pcard-img-wrap {
  position: relative;
  width: 100%;
  padding-top: 100%; /* square */
  background: var(--surf);
  overflow: hidden;
}
.pcard-img {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
.pcard-no-img {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  color: var(--border);
}

.rank-pin {
  position: absolute;
  top: 8px; left: 8px;
  background: var(--gold);
  color: #000;
  font-size: 0.62rem;
  font-weight: 900;
  padding: 3px 7px;
  border-radius: 8px;
}

.growth-pin {
  position: absolute;
  top: 8px; right: 8px;
  font-size: 0.65rem;
  font-weight: 800;
  padding: 3px 7px;
  border-radius: 8px;
}
.growth-pin.up   { background: rgba(62,207,107,.9);  color: #000; }
.growth-pin.down { background: rgba(254,44,85,.9);   color: #fff; }
.growth-pin.flat { background: rgba(60,60,60,.9);    color: #aaa; }
.growth-pin.new  { background: rgba(37,244,238,.9);  color: #000; }

/* body */
.pcard-body {
  flex: 1;
  padding: 10px 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pcard-title {
  font-size: 0.8rem;
  font-weight: 600;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--text);
}

.pcard-seller {
  font-size: 0.65rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* big number stats */
.pcard-stats {
  display: flex;
  gap: 12px;
}
.pstat { display: flex; flex-direction: column; }
.pstat-val {
  font-size: 1.25rem;
  font-weight: 900;
  letter-spacing: -0.5px;
  line-height: 1;
}
.pstat-lbl {
  font-size: 0.58rem;
  color: var(--muted);
  font-weight: 500;
  margin-top: 2px;
}

.growth-tag {
  font-size: 0.65rem;
  font-weight: 700;
  align-self: flex-end;
  color: var(--muted);
  background: rgba(255,255,255,.05);
  padding: 2px 6px;
  border-radius: 6px;
}

/* commission */
.pcard-comm {
  font-size: 0.68rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 8px;
  width: fit-content;
}
.pcard-comm.ok   { background: rgba(62,207,107,.12); color: var(--green); }
.pcard-comm.zero { background: rgba(100,100,100,.12); color: #555; }

/* meta (videos/creators) */
.pcard-meta {
  font-size: 0.63rem;
  color: var(--muted);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.pcard-meta span { display: flex; align-items: center; gap: 2px; }

/* cta */
.pcard-cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: var(--red);
  color: #fff;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 8px 0;
  border-radius: 8px;
  text-decoration: none;
  margin-top: auto;
  transition: opacity .15s;
}
.pcard-cta:hover, .pcard-cta:active { opacity: .85; }

/* ── EMPTY / LOADING ── */
.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 48px 20px;
  color: var(--muted);
}
.empty-icon { font-size: 3rem; display: block; margin-bottom: 10px; }
.empty p { font-size: 0.85rem; line-height: 1.7; }

.loading-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  gap: 14px;
  color: var(--muted);
  font-size: 0.8rem;
}
.spinner {
  width: 30px; height: 30px;
  border: 2.5px solid var(--border);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <div class="logo-icon">▶</div>
    <div>
      <div class="logo-name">TikTok Tracker</div>
      <div class="logo-sub">Thailand · Daily Intel</div>
    </div>
  </div>
  <div class="ts" id="updated">กำลังโหลด…</div>
</header>

<!-- TABS -->
<nav class="tabs">
  <div class="tab active" data-id="viral"  onclick="go('viral')">🚀 VIRAL</div>
  <div class="tab"        data-id="stable" onclick="go('stable')">📈 STABLE</div>
  <div class="tab"        data-id="peak"   onclick="go('peak')">⚠️ PEAK</div>
  <div class="tab"        data-id="top5"   onclick="go('top5')">🏆 TOP 5</div>
</nav>

<div id="viral"  class="section active"><div class="loading-wrap"><div class="spinner"></div>กำลังโหลด…</div></div>
<div id="stable" class="section"></div>
<div id="peak"   class="section"></div>
<div id="top5"   class="section"></div>

<script>
/* ── SWITCH TAB ── */
function go(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === id))
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === id))
}

/* ── HELPERS ── */
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')

function growthPin(g) {
  if (g == null) return '<span class="growth-pin new">✦ ใหม่</span>'
  if (g > 0)     return `<span class="growth-pin up">↑ +${g}%</span>`
  if (g < 0)     return `<span class="growth-pin down">↓ ${g}%</span>`
  return '<span class="growth-pin flat">→</span>'
}

function growthPinTop(g) {
  if (g == null) return '<span class="growth-pin new">✦ ใหม่</span>'
  if (g > 0)     return `<span class="growth-pin up">↑ +${g}%</span>`
  if (g < 0)     return `<span class="growth-pin down">↓ ${g}%</span>`
  return '<span class="growth-pin flat">→</span>'
}

function imgArea(url, rankNum, growth, isTop) {
  const rpin = rankNum ? `<div class="rank-pin">#${rankNum}</div>` : ''
  const gpin = isTop ? growthPinTop(growth) : growthPin(growth)
  const inner = url
    ? `<img class="pcard-img" src="${esc(url)}" onerror="this.parentNode.innerHTML='<div class=pcard-no-img>🛍</div>'">`
    : `<div class="pcard-no-img">🛍</div>`
  return `<div class="pcard-img-wrap">${inner}${rpin}${gpin}</div>`
}

/* ── TREND CARD ── */
function trendCard(item, cls) {
  return `
    <div class="pcard ${cls}">
      ${imgArea(item.img, null, null, false)}
      <div class="pcard-body">
        <div class="pcard-title">${esc(item.title)}</div>
        <div class="pcard-stats">
          <div class="pstat">
            <div class="pstat-val">${item.sold1d.toLocaleString()}</div>
            <div class="pstat-lbl">เมื่อวาน</div>
          </div>
          <div class="pstat">
            <div class="pstat-val">${item.sold3d.toLocaleString()}</div>
            <div class="pstat-lbl">3 วัน</div>
          </div>
          <span class="growth-tag">×${item.growth}</span>
        </div>
        ${item.link ? `<a class="pcard-cta" href="${esc(item.link)}" target="_blank" rel="noopener">ดูสินค้า →</a>` : ''}
      </div>
    </div>`
}

/* ── TOP CARD ── */
function topCard(item, rank) {
  const commHtml = item.comm === 0
    ? '<div class="pcard-comm zero">Commission 0% — เช็คก่อน</div>'
    : item.comm > 0
      ? `<div class="pcard-comm ok">💸 ${item.comm}% commission</div>`
      : ''

  const meta = []
  if (item.videos   != null) meta.push(`<span>🎬 ${item.videos}${item.videos===0?' · น้อยมาก!':''}</span>`)
  if (item.creators != null) meta.push(`<span>👥 ${item.creators}</span>`)

  return `
    <div class="pcard">
      ${imgArea(item.img, rank, item.growth, true)}
      <div class="pcard-body">
        <div class="pcard-title">${esc(item.title)}</div>
        ${item.seller ? `<div class="pcard-seller">🏪 ${esc(item.seller)}</div>` : ''}
        <div class="pcard-stats">
          <div class="pstat">
            <div class="pstat-val">${item.sold.toLocaleString()}</div>
            <div class="pstat-lbl">ขายรอบนี้</div>
          </div>
          <div class="pstat">
            <div class="pstat-val">${item.total.toLocaleString()}</div>
            <div class="pstat-lbl">รวมทั้งหมด</div>
          </div>
        </div>
        ${commHtml}
        ${meta.length ? `<div class="pcard-meta">${meta.join('')}</div>` : ''}
        ${item.link ? `<a class="pcard-cta" href="${esc(item.link)}" target="_blank" rel="noopener">ดูสินค้า →</a>` : ''}
      </div>
    </div>`
}

/* ── RENDER ── */
function renderTrend(items, id, meta) {
  const el = document.getElementById(id)
  const ac = {viral:'r', stable:'c', peak:'o'}[id] || 'r'
  const cls = id === 'top5' ? '' : id

  let html = `
    <div class="intro">
      <div class="intro-eyebrow">สินค้ากำลัง${meta.th}</div>
      <div class="intro-title"><span class="${ac}">${meta.icon} ${meta.en}</span></div>
      <div class="intro-sub">${meta.desc}</div>
    </div>
    <div class="grid">`

  if (!items || items.length === 0) {
    html += `<div class="empty"><span class="empty-icon">${meta.icon}</span><p>ไม่มีสินค้าในกลุ่มนี้วันนี้</p></div>`
  } else {
    items.forEach(item => { html += trendCard(item, cls) })
  }

  html += '</div>'
  el.innerHTML = html
}

function renderTop5(items) {
  const el = document.getElementById('top5')
  let html = `
    <div class="intro">
      <div class="intro-eyebrow">ยอดขายสูงสุด</div>
      <div class="intro-title"><span class="g">🏆 TOP 5</span></div>
      <div class="intro-sub">เรียงตาม GMV รายวัน — ดูก่อน ตัดสินใจที่ commission</div>
    </div>
    <div class="grid">`

  if (!items || items.length === 0) {
    html += `<div class="empty"><span class="empty-icon">🏆</span><p>ไม่มีข้อมูล TOP 5 วันนี้</p></div>`
  } else {
    items.forEach((item, i) => { html += topCard(item, i + 1) })
  }

  html += '</div>'
  el.innerHTML = html
}

/* ── FETCH ── */
async function init() {
  try {
    const r    = await fetch('data/latest.json?t=' + Date.now())
    if (!r.ok) throw r.status
    const data = await r.json()

    document.getElementById('updated').textContent = `อัพเดท ${data.updated}`

    renderTrend(data.viral,  'viral',  { icon:'🚀', en:'VIRAL',  th:'ระเบิด',  desc:'Growth ×2.5+ — ทำเลยก่อนใคร' })
    renderTrend(data.stable, 'stable', { icon:'📈', en:'STABLE', th:'โต',       desc:'ขึ้นสม่ำเสมอ — ยังทันทำคลิป' })
    renderTrend(data.peak,   'peak',   { icon:'⚠️', en:'PEAK',   th:'อิ่มตัว', desc:'ขายดีแต่ชะลอ — คู่แข่งเริ่มเยอะ' })
    renderTop5(data.top5)
  } catch (e) {
    document.getElementById('updated').textContent = 'โหลดไม่ได้'
    document.getElementById('viral').innerHTML = `
      <div class="intro">
        <div class="intro-title"><span class="r">🚀 VIRAL</span></div>
      </div>
      <div class="grid">
        <div class="empty">
          <span class="empty-icon">⚠️</span>
          <p>ยังไม่มีข้อมูล<br><small>รัน GitHub Actions ก่อน แล้วรีเฟรชหน้านี้</small></p>
        </div>
      </div>`
  }
}

init()
</script>
</body>
</html>
