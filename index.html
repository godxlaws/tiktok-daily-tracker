<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Tracker</title>
<style>
:root {
  --red:    #FE2C55;
  --cyan:   #25F4EE;
  --bg:     #F5F5F5;
  --surf:   #FFFFFF;
  --card:   #FFFFFF;
  --border: #E8E8E8;
  --text:   #111111;
  --sub:    #444444;
  --muted:  #888888;
  --green:  #1A9E4A;
  --orange: #D4700A;
  --gold:   #B8860B;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(245,245,245,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.logo { display: flex; align-items: center; gap: 10px; }

.logo-icon {
  width: 36px; height: 36px;
  background: var(--red);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  box-shadow: 3px 3px 0 #25F4EE;
  flex-shrink: 0;
}

.logo-name { font-size: 1rem; font-weight: 800; letter-spacing: -0.3px; color: var(--text); }
.logo-sub  { font-size: 0.65rem; color: var(--muted); }

.ts {
  font-size: 0.68rem;
  color: var(--sub);
  background: var(--surf);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 20px;
  white-space: nowrap;
}

/* ── TABS ── */
.tabs {
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--surf);
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 65px;
  z-index: 19;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex: 1;
  text-align: center;
  padding: 13px 8px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: color .15s, border-color .15s;
  user-select: none;
  margin-bottom: -2px;
}
.tab[data-id="viral"].active  { color: var(--red);    border-color: var(--red); }
.tab[data-id="stable"].active { color: #0099AA;        border-color: #0099AA; }
.tab[data-id="peak"].active   { color: var(--orange);  border-color: var(--orange); }
.tab[data-id="top5"].active   { color: var(--gold);    border-color: var(--gold); }

/* ── SECTIONS ── */
.section { display: none; }
.section.active { display: block; }

/* ── SECTION INTRO ── */
.intro {
  padding: 22px 16px 14px;
  background: var(--surf);
  border-bottom: 1px solid var(--border);
}
.intro-eyebrow {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.intro-title {
  font-size: 2rem;
  font-weight: 900;
  letter-spacing: -1px;
  line-height: 1;
  color: var(--text);
}
.intro-title .r { color: var(--red); }
.intro-title .c { color: #0099AA; }
.intro-title .o { color: var(--orange); }
.intro-title .g { color: var(--gold); }
.intro-sub {
  font-size: 0.82rem;
  color: var(--sub);
  margin-top: 6px;
  line-height: 1.5;
  font-weight: 500;
}

/* ── GRID ── */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 14px;
}
@media (min-width: 700px)  { .grid { grid-template-columns: repeat(3,1fr); } }
@media (min-width: 1000px) { .grid { grid-template-columns: repeat(4,1fr); } }

/* ── PRODUCT CARD ── */
.pcard {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
  transition: box-shadow .15s, transform .1s;
}
.pcard:active { transform: scale(0.98); }

.pcard.viral  { border-top: 3px solid var(--red); }
.pcard.stable { border-top: 3px solid #0099AA; }
.pcard.peak   { border-top: 3px solid var(--orange); }

/* image */
.pcard-img-wrap {
  position: relative;
  width: 100%;
  padding-top: 100%;
  background: #F0F0F0;
  overflow: hidden;
}
.pcard-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
.pcard-no-img {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem; color: #CCC;
}

.rank-pin {
  position: absolute;
  top: 8px; left: 8px;
  background: var(--gold);
  color: #fff;
  font-size: 0.62rem;
  font-weight: 900;
  padding: 3px 7px;
  border-radius: 8px;
}

.growth-pin {
  position: absolute;
  top: 8px; right: 8px;
  font-size: 0.65rem;
  font-weight: 800;
  padding: 3px 7px;
  border-radius: 8px;
}
.growth-pin.up   { background: #1A9E4A; color: #fff; }
.growth-pin.down { background: var(--red); color: #fff; }
.growth-pin.flat { background: #999; color: #fff; }
.growth-pin.new  { background: #0099AA; color: #fff; }

/* body */
.pcard-body {
  flex: 1;
  padding: 10px 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pcard-title {
  font-size: 0.82rem;
  font-weight: 600;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--text);
}

.pcard-seller {
  font-size: 0.65rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* stats */
.pcard-stats {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
.pstat { display: flex; flex-direction: column; }
.pstat-val {
  font-size: 1.25rem;
  font-weight: 900;
  letter-spacing: -0.5px;
  line-height: 1;
  color: var(--text);
}
.pstat-lbl {
  font-size: 0.58rem;
  color: var(--muted);
  font-weight: 600;
  margin-top: 2px;
}

.growth-tag {
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--muted);
  background: #F0F0F0;
  padding: 2px 6px;
  border-radius: 6px;
  align-self: flex-end;
}

/* commission */
.pcard-comm {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 8px;
  width: fit-content;
}
.pcard-comm.ok   { background: #E6F7EC; color: var(--green); border: 1px solid #B8E8C8; }
.pcard-comm.zero { background: #F5F5F5; color: #999;         border: 1px solid #DDD; }

/* meta */
.pcard-meta {
  font-size: 0.65rem;
  color: var(--sub);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  font-weight: 500;
}

/* cta */
.pcard-cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: var(--red);
  color: #fff;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 8px 0;
  border-radius: 8px;
  text-decoration: none;
  margin-top: auto;
  transition: opacity .15s;
}
.pcard-cta:hover { opacity: .85; }

/* ── EMPTY / LOADING ── */
.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 48px 20px;
  color: var(--muted);
}
.empty-icon { font-size: 3rem; display: block; margin-bottom: 10px; }
.empty p { font-size: 0.85rem; line-height: 1.7; color: var(--sub); }

.loading-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  gap: 14px;
  color: var(--sub);
  font-size: 0.85rem;
}
.spinner {
  width: 30px; height: 30px;
  border: 2.5px solid var(--border);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div class="logo-icon">▶</div>
    <div>
      <div class="logo-name">TikTok Tracker</div>
      <div class="logo-sub">Thailand · Daily Intel</div>
    </div>
  </div>
  <div class="ts" id="updated">กำลังโหลด…</div>
</header>

<nav class="tabs">
  <div class="tab active" data-id="viral"  onclick="go('viral')">🚀 VIRAL</div>
  <div class="tab"        data-id="stable" onclick="go('stable')">📈 STABLE</div>
  <div class="tab"        data-id="peak"   onclick="go('peak')">⚠️ PEAK</div>
  <div class="tab"        data-id="top5"   onclick="go('top5')">🏆 TOP 5</div>
</nav>

<div id="viral"  class="section active"><div class="loading-wrap"><div class="spinner"></div>กำลังโหลด…</div></div>
<div id="stable" class="section"></div>
<div id="peak"   class="section"></div>
<div id="top5"   class="section"></div>

<script>
function go(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === id))
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === id))
}

const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')

function growthPin(g) {
  if (g == null) return '<span class="growth-pin new">✦ ใหม่</span>'
  if (g > 0)     return `<span class="growth-pin up">↑ +${g}%</span>`
  if (g < 0)     return `<span class="growth-pin down">↓ ${g}%</span>`
  return '<span class="growth-pin flat">→</span>'
}

function imgArea(url, rankNum, growth) {
  const rpin = rankNum ? `<div class="rank-pin">#${rankNum}</div>` : ''
  const gpin = growth !== undefined ? growthPin(growth) : ''
  const inner = url
    ? `<img class="pcard-img" src="${esc(url)}" onerror="this.parentNode.innerHTML='<div class=pcard-no-img>🛍</div>'">`
    : `<div class="pcard-no-img">🛍</div>`
  return `<div class="pcard-img-wrap">${inner}${rpin}${gpin}</div>`
}

function trendCard(item, cls) {
  return `
    <div class="pcard ${cls}">
      ${imgArea(item.img)}
      <div class="pcard-body">
        <div class="pcard-title">${esc(item.title)}</div>
        <div class="pcard-stats">
          <div class="pstat">
            <div class="pstat-val">${item.sold1d.toLocaleString()}</div>
            <div class="pstat-lbl">เมื่อวาน</div>
          </div>
          <div class="pstat">
            <div class="pstat-val">${item.sold3d.toLocaleString()}</div>
            <div class="pstat-lbl">3 วัน</div>
          </div>
          <span class="growth-tag">×${item.growth}</span>
        </div>
        ${item.link ? `<a class="pcard-cta" href="${esc(item.link)}" target="_blank" rel="noopener noreferrer">ดูสินค้า →</a>` : ''}
      </div>
    </div>`
}

function topCard(item, rank) {
  const commHtml = item.comm === 0
    ? '<div class="pcard-comm zero">Commission 0% — เช็คก่อนทำ</div>'
    : item.comm > 0
      ? `<div class="pcard-comm ok">💸 ${item.comm}% commission</div>`
      : ''

  const meta = []
  if (item.videos   != null) meta.push(`🎬 ${item.videos} คลิป${item.videos===0?' (น้อยมาก!)':''}`)
  if (item.creators != null) meta.push(`👥 ${item.creators} Creator`)

  return `
    <div class="pcard">
      ${imgArea(item.img, rank, item.growth)}
      <div class="pcard-body">
        <div class="pcard-title">${esc(item.title)}</div>
        ${item.seller ? `<div class="pcard-seller">🏪 ${esc(item.seller)}</div>` : ''}
        <div class="pcard-stats">
          <div class="pstat">
            <div class="pstat-val">${item.sold.toLocaleString()}</div>
            <div class="pstat-lbl">ขายรอบนี้</div>
          </div>
          <div class="pstat">
            <div class="pstat-val">${item.total.toLocaleString()}</div>
            <div class="pstat-lbl">รวมทั้งหมด</div>
          </div>
        </div>
        ${commHtml}
        ${meta.length ? `<div class="pcard-meta">${meta.join(' · ')}</div>` : ''}
        ${item.link ? `<a class="pcard-cta" href="${esc(item.link)}" target="_blank" rel="noopener noreferrer">ดูสินค้า →</a>` : ''}
      </div>
    </div>`
}

function renderTrend(items, id, meta) {
  const el  = document.getElementById(id)
  const cls = id
  const ac  = {viral:'r', stable:'c', peak:'o'}[id] || 'r'

  let html = `
    <div class="intro">
      <div class="intro-eyebrow">สินค้ากำลัง${meta.th}</div>
      <div class="intro-title"><span class="${ac}">${meta.icon} ${meta.en}</span></div>
      <div class="intro-sub">${meta.desc}</div>
    </div>
    <div class="grid">`

  if (!items || items.length === 0) {
    html += `<div class="empty"><span class="empty-icon">${meta.icon}</span><p>ไม่มีสินค้าในกลุ่มนี้วันนี้</p></div>`
  } else {
    items.forEach(item => { html += trendCard(item, cls) })
  }

  html += '</div>'
  el.innerHTML = html
}

function renderTop5(items) {
  const el = document.getElementById('top5')
  let html = `
    <div class="intro">
      <div class="intro-eyebrow">ยอดขายสูงสุด</div>
      <div class="intro-title"><span class="g">🏆 TOP 5</span></div>
      <div class="intro-sub">เรียงตาม GMV รายวัน — ดู Commission ก่อนตัดสินใจทำคลิป</div>
    </div>
    <div class="grid">`

  if (!items || items.length === 0) {
    html += `<div class="empty"><span class="empty-icon">🏆</span><p>ไม่มีข้อมูล TOP 5 วันนี้</p></div>`
  } else {
    items.forEach((item, i) => { html += topCard(item, i + 1) })
  }

  html += '</div>'
  el.innerHTML = html
}

async function init() {
  try {
    const r    = await fetch('data/latest.json?t=' + Date.now())
    if (!r.ok) throw r.status
    const data = await r.json()

    document.getElementById('updated').textContent = `อัพเดท ${data.updated}`

    renderTrend(data.viral,  'viral',  { icon:'🚀', en:'VIRAL',  th:'ระเบิด',  desc:'Growth ×2.5 ขึ้นไป — ทำเลยก่อนใคร คู่แข่งยังน้อย' })
    renderTrend(data.stable, 'stable', { icon:'📈', en:'STABLE', th:'โต',       desc:'ยอดขายขึ้นสม่ำเสมอ — ยังทันทำคลิปและได้ผล' })
    renderTrend(data.peak,   'peak',   { icon:'⚠️', en:'PEAK',   th:'อิ่มตัว', desc:'ขายดีแต่โมเมนตัมชะลอ — คู่แข่งเริ่มเยอะ ระวัง' })
    renderTop5(data.top5)
  } catch(e) {
    document.getElementById('updated').textContent = 'โหลดไม่ได้'
    document.getElementById('viral').innerHTML = `
      <div class="intro">
        <div class="intro-title"><span class="r">🚀 VIRAL</span></div>
      </div>
      <div class="grid">
        <div class="empty">
          <span class="empty-icon">⚠️</span>
          <p>ยังไม่มีข้อมูล<br>รัน GitHub Actions ก่อน แล้วรีเฟรชหน้านี้</p>
        </div>
      </div>`
  }
}

init()
</script>
</body>
</html>
